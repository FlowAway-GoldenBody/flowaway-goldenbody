const width = screen.availWidth;

    function launchHomepage(newTab = false) {
      let a;
      if (newTab) a = window.open('about:blank', '_blank', `width=${width},height=${height},top=0,left=0,resizable=yes,scrollbars=yes`);
      else a = window.open('about:blank', '_blank');
      let script = a.document.createElement('script');
      script.src = 'ouchbad.js';
      a.document.body.appendChild(script);
    }
    let a = document.createElement('button');
    a.textContent = 'lauch homepage in new tab';
    a.style.width = '300px';
    a.style.height = '100px';
    a.onclick = () => launchHomepage(false);
    document.body.appendChild(a);
    let b = document.createElement('button');
    b.textContent = 'lauch homepage in new window';

    b.style.height = '100px';
